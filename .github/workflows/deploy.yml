name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The kinship engine gates the deploy: wrong labels are the one bug that
      # would silently misrepresent the whole family.
      - run: npm test

      # Config comes from the committed .env.production. Repository secrets, if
      # set, override it -- an empty secret is treated as unset so a half-filled
      # secrets page cannot blank out a working config.
      - name: Build
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_TREE_ID: ${{ secrets.VITE_TREE_ID }}

      # A bundle without the config silently falls back to browser-only mode and
      # shows no sign-in button, which looks like a bug in the app rather than a
      # build misconfiguration. Fail here instead, where the reason is visible.
      - name: Verify Firebase config reached the bundle
        run: |
          if grep -rqF "$(grep '^VITE_FIREBASE_PROJECT_ID=' .env.production | cut -d= -f2)" dist/assets/*.js; then
            echo "Firebase project id is present in the built bundle."
          else
            echo "::error::Built bundle contains no Firebase project id -- the site would deploy in Local-only mode with no sign-in button."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
